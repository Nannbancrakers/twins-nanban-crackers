<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Twins & Nanban Crackers</title>
    <link rel="icon" type="image/png" href="assets/twins_nanban_logo.png">
    <link rel="stylesheet" href="css/styles.css?v=2">
    <link rel="stylesheet" href="css/responsive.css">
    
</head>
<body>
    <!-- Header -->
     
    <div id="header-container"></div>

    <!-- Page Banner -->
    <section class="page-banner">
        <div class="container">
            <h1>Your Cart</h1>
            <p>Review your selected fireworks before placing your order</p>
        </div>
    </section>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container cart-layout">
            <!-- Cart Items -->
            <div class="cart-items-panel" id="cart-items-panel">
                <div class="cart-items-toolbar" id="cart-items-toolbar" style="display:none;">
                    <a href="products.html" class="cart-back-browse">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back to Browse
                    </a>
                    <button type="button" class="cart-clear-btn" id="cart-clear-btn">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        Clear Cart
                    </button>
                </div>
                <div class="cart-loading" id="cart-loading">Loading cart...</div>
                <div id="cart-content"></div>
            </div>

            <!-- Order Summary -->
            <aside class="cart-summary" id="cart-summary">
                <div class="cart-summary-head">
                    <h3>Order Summary</h3>
                    <span class="cart-summary-count" id="cart-summary-count">0 items</span>
                </div>
                <div class="cart-summary-rows">
                    <div class="cart-summary-row">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">₹0</span>
                    </div>
                    <div class="cart-summary-row">
                        <span>Mrp Discount</span>
                        <span id="cart-savings" class="cart-savings">− ₹0</span>
                    </div>
                    <div class="cart-summary-row cart-summary-total">
                        <span>Total</span>
                        <span id="cart-total">₹0</span>
                    </div>
                </div>
                <div class="cart-bill-customer" id="cart-bill-customer">
                    <span class="cart-bill-label">Bill To (for invoice)</span>
                    <input type="text" id="inv-customer-name" class="cart-bill-input" placeholder="Enter your name" autocomplete="name">
                    <input type="tel" id="inv-customer-mobile" class="cart-bill-input" placeholder="Enter 10 digit number" inputmode="numeric" maxlength="10" autocomplete="tel">
                </div>
                <button type="button" class="btn btn-primary cart-order-btn" id="cart-order-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                    Order Now
                </button>
                <button type="button" class="btn btn-outline cart-invoice-btn" id="cart-invoice-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Download Invoice
                </button>
            </aside>
        </div>
    </section>

    <!-- Order Details Modal -->
    <div class="filter-overlay order-overlay" id="order-overlay"></div>
    <div class="order-modal" id="order-modal" role="dialog" aria-modal="true" aria-labelledby="order-modal-title">
        <div class="order-modal-head">
            <h3 id="order-modal-title">Confirm Your Order</h3>
            <button type="button" class="filter-drawer-close" id="order-modal-close" aria-label="Close">&times;</button>
        </div>
        <p class="order-modal-sub">Your order will be sent to us on WhatsApp using the bill details you provided above.</p>
        <form id="order-form" class="order-form" novalidate>
            <div class="order-modal-actions">
                <button type="button" class="btn btn-outline order-cancel-btn" id="order-cancel-btn">Cancel</button>
                <button type="submit" class="btn btn-primary order-submit-btn" id="order-submit-btn">Place Order</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="js/main.js?v=2"></script>
</body>
</html>
